name: CI

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  frontend-quality:
    name: Frontend Build, Lint and Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./app/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

  test-backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./app/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./app/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Tests (Coverage)
        run: npm run coverage
