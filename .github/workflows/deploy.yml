name: Deploy to DigitalOcean Droplet

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -Eeuo pipefail

            REPO_DIR="$HOME/Software_Proyecto"
            PROD_COMPOSE="docker-compose.prod.yml"
            PREV_COMMIT=$(git -C "$REPO_DIR" rev-parse HEAD)
            TARGET_COMMIT="${{ github.sha }}"

            wait_for_backend() {
              for _ in $(seq 1 24); do
                if docker compose "$@" exec -T backend \
                  wget --no-verbose --tries=1 --spider http://localhost:3001/health; then
                  return 0
                fi
                sleep 5
              done
              return 1
            }

            rollback() {
              echo "Restaurando commit anterior: $PREV_COMMIT"
              git -C "$REPO_DIR" reset --hard "$PREV_COMMIT"
              cd "$REPO_DIR/app"

              if [ -f "$PROD_COMPOSE" ]; then
                if ! docker compose -f "$PROD_COMPOSE" build \
                  || ! docker compose -f "$PROD_COMPOSE" up -d --remove-orphans --wait --wait-timeout 120 \
                  || ! wait_for_backend -f "$PROD_COMPOSE"; then
                  return 1
                fi
              else
                # Compatibilidad con el primer despliegue de esta separación.
                if ! docker compose -f docker-compose.yml up -d --build \
                  || ! wait_for_backend -f docker-compose.yml; then
                  return 1
                fi
              fi
              return 0
            }

            echo "Desplegando $TARGET_COMMIT (versión anterior: $PREV_COMMIT)"
            git -C "$REPO_DIR" fetch origin "$TARGET_COMMIT"
            git -C "$REPO_DIR" reset --hard "$TARGET_COMMIT"
            cd "$REPO_DIR/app"

            # El build ocurre antes de reemplazar cualquier contenedor.
            if ! docker compose -f "$PROD_COMPOSE" build; then
              git -C "$REPO_DIR" reset --hard "$PREV_COMMIT"
              echo "El build falló; los contenedores actuales no fueron modificados."
              exit 1
            fi

            if docker compose -f "$PROD_COMPOSE" up -d --remove-orphans --wait --wait-timeout 120 \
              && wait_for_backend -f "$PROD_COMPOSE"; then
              docker compose -f "$PROD_COMPOSE" ps
              echo "Despliegue saludable completado."
              exit 0
            fi

            echo "El despliegue no quedó saludable. Estado y logs:"
            docker compose -f "$PROD_COMPOSE" ps || true
            docker compose -f "$PROD_COMPOSE" logs --no-color --tail=200 || true

            if rollback; then
              echo "Rollback saludable completado; el workflow queda en rojo."
            else
              echo "ERROR: el rollback tampoco quedó saludable."
            fi
            exit 1
